<div class="container-fluid vh-100">
  <div class="row h-100">
    
    <div class="col-md-6 panel-login d-flex flex-column justify-content-center align-items-center text-white p-4">
      
      <div *ngIf="mensaje" class="w-100 px-4 text-center mb-4 p-3 rounded mensaje" 
           [ngClass]="{ 'mensaje-error': tipoMensaje === 'error', 'mensaje-success': tipoMensaje === 'success' }">
        {{ mensaje }}
      </div>

      <div *ngIf="!mostrarRegistro" class="w-100 px-4">
        <h2 class="text-center mb-4 fw-bold">Iniciar Sesión</h2>
        <form (submit)="$event.preventDefault(); iniciarSesion()">
          <input type="email" class="form-control mb-3" placeholder="Correo Electrónico" [(ngModel)]="correoLogin" name="correoLogin">
          <input type="password" class="form-control mb-3" placeholder="Contraseña" [(ngModel)]="contrasenaLogin" name="contrasenaLogin">
          <button type="submit" class="btn btn-login w-100">Iniciar Sesión</button>
        </form>
        <p class="text-center mt-3 text-secondary-custom">
          ¿No tienes una cuenta? <span class="text-action-link" style="cursor: pointer;" (click)="cambiarFormulario()">Regítrate</span>
        </p>
      </div>

      <div *ngIf="mostrarRegistro" class="w-100 px-4">
        <h2 class="text-center mb-4 fw-bold">Registrarse</h2>
        <form (submit)="$event.preventDefault(); resgistrar()">
          <input type="email" class="form-control mb-3" placeholder="Correo Electrónico" [(ngModel)]="correo" name="correo">
          <input type="password" class="form-control mb-3" placeholder="Contraseña" [(ngModel)]="contrasena" name="contrasena">
          <input type="password" class="form-control mb-3" placeholder="Confirmar contraseña" [(ngModel)]="confirmarContrasena" name="confirmarContrasena">
          <input type="text" class="form-control mb-3" placeholder="Nombres" [(ngModel)]="nombre" name="nombre">
          <input type="text" class="form-control mb-3" placeholder="Apellidos" [(ngModel)]="apellidos" name="apellidos">
          <input type="text" class="form-control mb-3" placeholder="Nombre de usuario" [(ngModel)]="nombreUsuario" name="nombreUsuario">
          <input type="date" class="form-control mb-3" placeholder="Fecha de nacimiento" [(ngModel)]="fechaNacimiento" name="fechaNacimiento">
          <input type="text" class="form-control mb-3" placeholder="País" [(ngModel)]="pais" name="pais">
          <button type="submit" class="btn btn-login w-100">Registrarse</button>
        </form>
        <p class="text-center mt-3 text-secondary-custom">
          ¿Ya tienes una cuenta? <span class="text-action-link" style="cursor: pointer;" (click)="cambiarFormulario()">Inicia Sesión</span>
        </p>
      </div>
    </div>

    <div class="col-md-6 p-0 d-none d-md-block imagen-login">
      <img src="imagenes/juegosLogin.jpeg" class="w-100 h-100 object-fit-cover" alt="Respawn Keys Banner">
    </div>

  </div>
</div>
